[project]
name = "amplitrim"
version = "0.1.0"
description = "Recommends DADA2 truncLenF, truncLenR and maxEE for paired-end amplicon reads by testing candidate settings on your own reads."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Payton Yau" }]
keywords = ["DADA2", "amplicon sequencing", "16S rRNA", "ITS", "paired-end reads", "truncLen", "maxEE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest", "pandas>=2.0"]      # pandas is used only by the tests

[project.urls]
Homepage = "https://github.com/paytonyau/amplitrim"
Issues = "https://github.com/paytonyau/amplitrim/issues"

[project.scripts]
amplitrim = "amplitrim.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["amplitrim"]
